pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}
rootProject.name = 'sculptory'

// v1 layout. The old modules were removed; see tag v0-final.
include 'core', 'protocol', 'server', 'common', 'fabric', 'neoforge', 'paper'
project(':core').projectDir = file('modules/core')
project(':protocol').projectDir = file('modules/protocol')
project(':server').projectDir = file('modules/server')
project(':common').projectDir = file('modules/common')
project(':fabric').projectDir = file('modules/fabric')
project(':neoforge').projectDir = file('modules/neoforge')
project(':paper').projectDir = file('modules/paper')
