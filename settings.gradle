pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}
rootProject.name = 'sculptory'

// v1 layout. The old modules were removed; see tag v0-final.
include 'core', 'protocol', 'fabric'
project(':core').projectDir = file('modules/core')
project(':protocol').projectDir = file('modules/protocol')
project(':fabric').projectDir = file('modules/fabric')
