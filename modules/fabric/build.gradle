// The single Sculptory mod: common/server in src/main, client-only in src/client.
apply plugin: 'net.fabricmc.fabric-loom-remap'

base { archivesName = 'sculptory-fabric' }

loom {
    splitEnvironmentSourceSets()
    // The Mixin annotation processor and refmaps, the format 0.4.0-beta shipped and the one checked on a real server
    // install with the minimum loader (Loom 1.12+ would rewrite the mixin annotations statically instead). Check the
    // release jar on the minimum loader before every release: the compile-time Mixin library decides what loads there.
    mixin { useLegacyMixinAp = true }
    mods {
        sculptory {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    // The widener lives with the code that needs it (modules/common); its resources are folded in below.
    accessWidenerPath = rootProject.file('modules/common/src/main/resources/sculptory.accesswidener')
    runs {
        client {
            // -PbsRunDir=<dir relative to modules/fabric>: a second client's own game directory (the two-client play check).
            runDir((project.findProperty('bsRunDir') ?: '../../.local/run/client').toString())
            // Fixed offline name so test-server ops/permissions are predictable; -PbsUser=<name> for a second player.
            programArgs '--username', (project.findProperty('bsUser') ?: 'BuilderDev').toString()
            if (project.hasProperty('bsWorld')) programArgs '--quickPlaySingleplayer', project.property('bsWorld').toString()
            if (project.hasProperty('bsServer')) programArgs '--quickPlayMultiplayer', project.property('bsServer').toString()
            // -PbsSize=<width>x<height>: the game window's size (the screenshot tour uses 1600x900).
            if (project.hasProperty('bsSize')) {
                def size = project.property('bsSize').toString().split('x')
                if (size.length != 2 || !size.every { it.isInteger() }) {
                    throw new GradleException("-PbsSize wants <width>x<height>, e.g. 1600x900")
                }
                programArgs '--width', size[0], '--height', size[1]
            }
            // -PbsTour=<absolute dir>: the dev-only screenshot tour (scripts/playtest.ps1 -Tour).
            if (project.hasProperty('bsTour')) property 'sculptory.tour', project.property('bsTour').toString()
            // The tour's base UI size (percent) and window layout file, and whether it maximises the window.
            if (project.hasProperty('bsTourUiSize')) property 'sculptory.tour.uiSize', project.property('bsTourUiSize').toString()
            if (project.hasProperty('bsTourLayout')) property 'sculptory.tour.layout', project.property('bsTourLayout').toString()
            if (project.hasProperty('bsTourMaximize')) property 'sculptory.tour.maximize', 'true'
            // -PbsTourWiki=<absolute dir>: the tour's wiki mode writes the wiki pictures there (scripts/playtest.ps1 -Tour -Wiki).
            if (project.hasProperty('bsTourWiki')) property 'sculptory.tour.wiki', project.property('bsTourWiki').toString()
            // -PbsCheck=<absolute dir>: the dev-only play check (scripts/playtest.ps1 -Check), with
            // its role (solo, a, b), suite (full, visual), scenario name prefixes and the renderer's name for the report.
            if (project.hasProperty('bsCheck')) property 'sculptory.check', project.property('bsCheck').toString()
            if (project.hasProperty('bsCheckRole')) property 'sculptory.check.role', project.property('bsCheckRole').toString()
            if (project.hasProperty('bsCheckSuite')) property 'sculptory.check.suite', project.property('bsCheckSuite').toString()
            if (project.hasProperty('bsCheckOnly')) property 'sculptory.check.only', project.property('bsCheckOnly').toString()
            if (project.hasProperty('bsCheckLabel')) property 'sculptory.check.label', project.property('bsCheckLabel').toString()
            // -PbsDemo=<absolute dir>: the dev-only scripted demo (scripts/playtest.ps1 -Demo), with the
            // step to start at (a number or id) and whether to maximise the window.
            if (project.hasProperty('bsDemo')) property 'sculptory.demo', project.property('bsDemo').toString()
            if (project.hasProperty('bsDemoFrom')) property 'sculptory.demo.from', project.property('bsDemoFrom').toString()
            if (project.hasProperty('bsDemoMaximize')) property 'sculptory.demo.maximize', 'true'
            if (project.hasProperty('bsDemoAutoStart')) property 'sculptory.demo.autoStart', project.property('bsDemoAutoStart').toString()
            if (project.hasProperty('bsDemoNoCaptions')) property 'sculptory.demo.captions', 'false'
            // -PbsPlaytest: the dev-only playtest setup (PlaytestSetup: the tester is op, day is locked, mobs are off) on the
            // integrated server of every world this client opens (scripts/playtest.ps1 passes it by default).
            if (project.hasProperty('bsPlaytest')) property 'sculptory.playtest', 'true'
        }
        server {
            runDir '../../.local/run/server'
            // -PbsPlaytest: the dev-only playtest setup (scripts/playtest-server.ps1 passes it by default).
            if (project.hasProperty('bsPlaytest')) property 'sculptory.playtest', 'true'
        }
    }
}

// The dev server listens on 127.0.0.1:25580 in offline mode however it is started (-PbsPlaytest ops whoever joins as
// BuilderDev); scripts/playtest-server.ps1 sets the other keys (gradle/dev-server-properties.gradle).
apply from: rootProject.file('gradle/dev-server-properties.gradle')
tasks.named { it == 'runServer' }.configureEach {
    def runDir = rootProject.file('.local/run/server')
    def setProperties = setServerProperties
    doFirst { setProperties(runDir, ['server-port': '25580', 'server-ip': '127.0.0.1', 'online-mode': 'false']) }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'sculptory-gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

// The GameTests are shared with the other loaders (modules/common, src/gametest: the tests, their support classes,
// mixins and resources, compiled there with no loader API). This source set adds the Fabric side: the test mod's
// fabric.mod.json, its bootstrap and FabricGameTestLoader.
sourceSets {
    gametest {
        java.srcDir project(':common').sourceSets.gametest.java
        resources.srcDir project(':common').sourceSets.gametest.resources
    }
}

// Mojang's official names (the names NeoForge, Paper and Minecraft 26.1+ use), with Parchment's parameter names and
// javadoc on top. The jar is still remapped to intermediary for Fabric Loader.
repositories {
    exclusiveContent {
        forRepository { maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' } }
        filter { includeGroup 'org.parchmentmc.data' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    implementation project(':core')
    include project(':core')
    implementation project(':protocol')
    include project(':protocol')
    implementation project(':server')
    include project(':server')

    modImplementation "me.lucko:fabric-permissions-api:${rootProject.permissions_api_version}"
    include "me.lucko:fabric-permissions-api:${rootProject.permissions_api_version}"

    testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
    testImplementation testFixtures(project(':core'))
}

// The loader-free Minecraft code (modules/common) is compiled into this mod's own source sets, so the Fabric jar carries
// it remapped like the rest and Loom's Mixin processing covers its mixins. The common module compiles the same sources
// on its own, with no loader API, to prove they need none.
sourceSets {
    main {
        java.srcDir project(':common').sourceSets.main.java
        resources.srcDir project(':common').sourceSets.main.resources
    }
    client {
        java.srcDir project(':common').sourceSets.client.java
        resources.srcDir project(':common').sourceSets.client.resources
    }
}

// JUnit tests may exercise pure client-side classes (UI layout, input routing, math).
sourceSets {
    test {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

// The dev-only client harnesses (the screenshot tour, the play check, the scripted demo, the development-only
// /bsclient commands, and the unregistered UI toolkit preview) run from the source sets (runClient,
// scripts/playtest.ps1) and never from the jar, so the jar leaves them out. SculptoryClientMod starts them only when
// their class is there (DevHarnessClassesTest checks that nothing else refers to them). Their sources stay in the
// sources jar.
// The development-only /bsclient commands are typed on Fabric's client command API, so they live in the Fabric layer.
def devHarnessPackages = ['check', 'demo', 'tour', 'ui/demo'].collect { "dev/sculptory/mc/client/editor/${it}/**".toString() } +
        ['dev/sculptory/fabric/client/editor/devtools/**']
// The dev-only server side: the playtest setup (op, day, no mobs; modules/common), which SculptoryMod starts only when
// its class is there.
def devServerPackages = ['dev/sculptory/mc/playtest/**']
tasks.named('jar') { exclude devHarnessPackages + devServerPackages }

// DedicatedServerClassesTest scans the common/server output and the shared server module (what a dedicated server
// loads) for client-only references;
// DevHarnessClassesTest scans the client and common outputs for references to the dev packages the jar leaves out
// (above), and the remapped jar for the packages themselves.
tasks.named('test') {
    def serverClasses = project(':server').sourceSets.main.output.classesDirs
    def remappedJar = tasks.named('remapJar').flatMap { it.archiveFile }
    dependsOn ':server:classes', tasks.named('remapJar')
    inputs.file remappedJar
    doFirst { systemProperty 'sculptory.jar', remappedJar.get().asFile.absolutePath }
    systemProperty 'sculptory.mainClassDirs', (sourceSets.main.output.classesDirs + serverClasses).asPath
    systemProperty 'sculptory.mainResourceDir', sourceSets.main.output.resourcesDir.absolutePath
    systemProperty 'sculptory.clientClassDirs', sourceSets.client.output.classesDirs.asPath
    systemProperty 'sculptory.devHarnessPackages', devHarnessPackages.join(',')
    systemProperty 'sculptory.devServerPackages', devServerPackages.join(',')
}

processResources {
    def version = project.version.toString()
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand version: version }
}

// The jar is named after the build id (root build.gradle), so a new build leaves the older builds' jars behind: they
// are removed from build/libs when the new jar is written, and only the current build is there to pick up.
tasks.named('remapJar') {
    def libs = layout.buildDirectory.dir('libs')
    def keep = ["sculptory-fabric-${project.version}.jar".toString(),
                "sculptory-fabric-${project.version}-sources.jar".toString()]
    doFirst {
        libs.get().asFile.listFiles()?.each { file ->
            if (file.name.startsWith('sculptory-') && file.name.endsWith('.jar') && !keep.contains(file.name)) {
                file.delete()
            }
        }
    }
}

// The wiki (docs/wiki: pages and their pictures) goes into the mod for the in-game reader, which reads
// sculptory:wiki/<page>.md and wiki/images/*.png.
tasks.named('processClientResources') {
    from(rootProject.file('docs/wiki')) {
        include '*.md', 'images/*.png'
        into 'assets/sculptory/wiki'
    }
}

// Game tests run headless on a throwaway server; make them part of `check`.
tasks.named('check') { dependsOn tasks.named('runGameTest') }

// Every GameTest run starts from a fresh world (gradle/fresh-gametest-world.gradle says why and how).
apply from: rootProject.file('gradle/fresh-gametest-world.gradle')
tasks.register('freshGameTestWorld') {
    description = 'Removes the GameTest world, so runGameTest starts from a fresh one.'
    def runDir = file('build/run/gameTest')
    doLast { freshGameTestWorld(runDir) }
}
tasks.named('runGameTest') { dependsOn tasks.named('freshGameTestWorld') }

// Mod-fidelity GameTests (M4): the engine against Chipped and Farmer's Delight.
// They get their own source set, mod (sculptory-fidelity) and headless server run, so the third-party mods reach
// neither the jar nor runClient/runServer/runGameTest. The source set sees the gametest helper classes (not its
// resources, so the vanilla tests do not run again here).
repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// The fidelity tests themselves are shared too (modules/common/src/fidelity, compiled only by the loader modules, each
// against its own build of the mods); src/fidelity here holds the Fabric test mod's metadata and bootstrap.
sourceSets {
    fidelity {
        def shared = sourceSets.main.output + sourceSets.client.output + sourceSets.gametest.output.classesDirs
        compileClasspath += shared
        runtimeClasspath += shared
        java.srcDir project(':common').file('src/fidelity/java')
        resources.srcDir project(':common').file('src/fidelity/resources')
    }
}
// The fidelity tests are placed on the shared empty structure (the GameTest resources are not on this run's classpath).
tasks.named('processFidelityResources') {
    from(project(':common').sourceSets.gametest.resources.srcDirs) { include 'data/**' }
}

configurations {
    fidelityCompileClasspath.extendsFrom gametestCompileClasspath
    fidelityRuntimeClasspath.extendsFrom gametestRuntimeClasspath
    // The mods that nest libraries (jar-in-jar), unremapped: see extractFidelityNestedJars.
    fidelityNesting { transitive = false }
}

loom {
    createRemapConfigurations(sourceSets.fidelity)
    mods {
        'sculptory-fidelity' { sourceSet sourceSets.fidelity }
    }
    runs {
        fidelityGameTest {
            server()
            name "Fidelity Game Test"
            source sourceSets.fidelity
            property 'fabric-api.gametest'
            runDir 'build/run/fidelityGameTest'
            ideConfigGenerated false
        }
    }
}

// Loom strips jar-in-jar libraries from the mods it remaps, so the run adds the ones these mods ship themselves,
// unchanged: Fabric ASM v2.3 (Farmer's Delight), yabn 1.0.3 and bytecodecs 1.1.2 (Resourceful Lib).
def fidelityNested = tasks.register('extractFidelityNestedJars', Sync) {
    from(configurations.fidelityNesting.elements.map { jars -> jars.collect { zipTree(it.asFile) } }) {
        include 'META-INF/jars/*.jar'
        eachFile { path = name }
    }
    into layout.buildDirectory.dir('fidelity-nested')
    includeEmptyDirs = false
}

dependencies {
    modFidelityImplementation "maven.modrinth:farmers-delight-refabricated:${rootProject.fidelity_farmersdelight}"
    modFidelityRuntimeOnly "maven.modrinth:chipped:${rootProject.fidelity_chipped}"
    modFidelityRuntimeOnly "maven.modrinth:athena-ctm:${rootProject.fidelity_athena}"
    modFidelityRuntimeOnly "maven.modrinth:resourceful-lib:${rootProject.fidelity_resourcefullib}"
    fidelityRuntimeOnly fileTree(dir: layout.buildDirectory.dir('fidelity-nested').get().asFile, include: '*.jar')
            .builtBy(fidelityNested)
    fidelityNesting "maven.modrinth:farmers-delight-refabricated:${rootProject.fidelity_farmersdelight}"
    fidelityNesting "maven.modrinth:resourceful-lib:${rootProject.fidelity_resourcefullib}"
}

def fidelityEula = tasks.register('acceptFidelityGameTestEula') {
    def eula = file('build/run/fidelityGameTest/eula.txt')
    outputs.file eula
    doLast {
        eula.parentFile.mkdirs()
        eula.text = 'eula=true\n'
    }
}
// A fresh world for every run, as for runGameTest.
tasks.register('freshFidelityGameTestWorld') {
    description = 'Removes the fidelity GameTest world, so runFidelityGameTest starts from a fresh one.'
    def runDir = file('build/run/fidelityGameTest')
    doLast { freshGameTestWorld(runDir) }
}
tasks.named('runFidelityGameTest') {
    dependsOn fidelityEula, tasks.named('freshFidelityGameTestWorld')
    mustRunAfter tasks.named('runGameTest')
}
tasks.named('check') { dependsOn tasks.named('runFidelityGameTest') }

// -PgameTestFilter=<text>[,<text>...] runs only the GameTests whose name (<class>.<method>, lower case) or batch id
// contains one of the entries, in runGameTest and runFidelityGameTest. Fabric API 0.116.4 has no filter of its own:
// GameTestFilter (modules/common/src/gametest) reads this system property, and a filter that matches nothing fails
// the run.
if (project.hasProperty('gameTestFilter')) {
    def gameTestFilter = project.property('gameTestFilter').toString()
    loom.runs.matching { it.name in ['gameTest', 'fidelityGameTest'] }.configureEach {
        property 'sculptory.gametest.filter', gameTestFilter
    }
}

// The GameTest servers get the heap a GitHub Actions runner gives them by default (a quarter of its 16 GB), on every
// machine: Java's own default is a quarter of the RAM, so a larger machine would hide a run that no longer fits.
loom.runs.matching { it.name in ['gameTest', 'fidelityGameTest'] }.configureEach {
    // Fails any permit asked about a cell outside the bounds it was asked for (server engine PermitBounds).
    property 'sculptory.checkPermitBounds', 'true'
    vmArg '-Xmx4G'
}

// Optional render mods for Sodium/Iris compatibility checks in the dev client. Off by
// default: -PbsSodium adds Sodium, -PbsIris adds Iris and the Sodium it needs. modLocalRuntime only, so they are never
// bundled, published or compiled against. Pinned by Modrinth version id in gradle.properties.
// The Modrinth Maven is the exclusive repository declared above for the fidelity tests.
if (project.hasProperty('bsSodium') || project.hasProperty('bsIris')) {
    configurations {
        // Iris unremapped, for the libraries it nests: see extractRenderModNestedJars.
        renderModNesting { transitive = false }
    }
    // Loom drops the jar-in-jar list of the mods it remaps. Iris nests glsl-transformer, jcpp and antlr4-runtime
    // (Sodium nests only Fabric API modules, already present), so the run gets those jars unchanged out of the pinned
    // Iris jar.
    def renderModNested = tasks.register('extractRenderModNestedJars', Sync) {
        from(configurations.renderModNesting.elements.map { jars -> jars.collect { zipTree(it.asFile) } }) {
            include 'META-INF/jars/glsl-transformer-*.jar', 'META-INF/jars/jcpp-*.jar', 'META-INF/jars/antlr4-runtime-*.jar'
            eachFile { path = name }
        }
        into layout.buildDirectory.dir('render-mod-nested')
        includeEmptyDirs = false
    }
    dependencies {
        modLocalRuntime "maven.modrinth:sodium:${rootProject.sodium_version}"
        if (project.hasProperty('bsIris')) {
            modLocalRuntime "maven.modrinth:iris:${rootProject.iris_version}"
            renderModNesting "maven.modrinth:iris:${rootProject.iris_version}"
            localRuntime fileTree(dir: layout.buildDirectory.dir('render-mod-nested').get().asFile, include: '*.jar')
                    .builtBy(renderModNested)
        }
    }
}
