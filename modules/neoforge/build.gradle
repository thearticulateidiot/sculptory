// Sculptory for NeoForge: the loader-free Minecraft code (modules/common) and the engine behind NeoForge's events.
// NeoForge runs on Mojang's names, so nothing is remapped: the jar holds the classes as javac wrote them.
apply plugin: 'net.neoforged.moddev'

base { archivesName = 'sculptory-neoforge' }

// The access widener (modules/common, the Fabric format) as a NeoForge access transformer, generated at build time so
// the two never drift. Both are in Mojang's names. See the task below for the mapping.
def widener = rootProject.file('modules/common/src/main/resources/sculptory.accesswidener')
// Entries NeoForge needs beyond the widener's (see the file).
def atExtra = file('src/main/accesstransformer/neoforge-extra.cfg')
def generatedAtDir = layout.buildDirectory.dir('generated/accesstransformer')
def generateAccessTransformer = tasks.register('generateAccessTransformer') {
    description = 'Writes META-INF/accesstransformer.cfg from the common module\'s access widener.'
    inputs.files widener, atExtra
    outputs.dir generatedAtDir
    def out = generatedAtDir.map { it.file('META-INF/accesstransformer.cfg').asFile }
    doLast {
        out.get().parentFile.mkdirs()
        out.get().setText(AccessWidenerToAt.convert(widener) + '\n' + atExtra.getText('UTF-8'), 'UTF-8')
    }
}
def generatedAt = files(generatedAtDir.map { it.file('META-INF/accesstransformer.cfg') }).builtBy(generateAccessTransformer)

neoForge {
    version = rootProject.neoforge_version
    // Parchment's parameter names and javadoc, as modules/common and modules/fabric get them.
    parchment {
        minecraftVersion = rootProject.minecraft_version
        mappingsVersion = rootProject.parchment_version
    }
    // Applied to the Minecraft jar the mod compiles and runs against in development; the jar carries the same file
    // (neoforge.mods.toml), which NeoForge applies to the installed game.
    accessTransformers.from(generatedAt)
    validateAccessTransformers = true

    mods {
        sculptory {
            sourceSet sourceSets.main
            // The engine is part of the mod (its classes are packed into the mod jar, see the jar task), so in
            // development its class folders load as part of the mod too, not as a separate library.
            sourceSet project(':core').sourceSets.main
            sourceSet project(':protocol').sourceSets.main
            sourceSet project(':server').sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = rootProject.file('.local/run/neoforge-client')
            programArgument '--username'
            programArgument((project.findProperty('bsUser') ?: 'BuilderDev').toString())
            if (project.hasProperty('bsServer')) {
                programArgument '--quickPlayMultiplayer'
                programArgument project.property('bsServer').toString()
            }
        }
        server {
            server()
            gameDirectory = rootProject.file('.local/run/neoforge-server')
            programArgument '--nogui'
        }
    }
}

// The loader-free Minecraft code is compiled into this mod's one source set (NeoForge has no client/server source set
// split; DedicatedServerClassesTest in modules/fabric and the common module's own split compile keep server code off
// client classes).
sourceSets {
    main {
        java.srcDir project(':common').sourceSets.main.java
        java.srcDir project(':common').sourceSets.client.java
        resources.srcDir project(':common').sourceSets.main.resources
        resources.srcDir project(':common').sourceSets.client.resources
        resources.srcDir generatedAtDir
    }
}

dependencies {
    // Compile against the engine without putting its jars on the run classpath: the mod's run folders hold its classes
    // (neoForge.mods above), and two copies of a package would not load.
    compileOnly project(':core')
    compileOnly project(':protocol')
    compileOnly project(':server')
    // PermissionMappingTest: the mapping walks the engine's Perm nodes.
    testImplementation project(':server')
}

// The dev-only client harnesses run from a dev checkout, never from the jar (as in modules/fabric).
def devHarnessPackages = ['check', 'demo', 'tour', 'ui/demo'].collect { "dev/sculptory/mc/client/editor/${it}/**".toString() }

// The engine (core, protocol, server) is packed into the mod jar as classes. Its packages are all dev.sculptory.*, so
// nothing needs relocating. Not jarJar: NeoForge would load each nested plain jar as its own module named after the
// file ("core", "server"), names another mod's library can share.
def engineProjects = [':core', ':protocol', ':server']
tasks.named('jar') {
    engineProjects.each { path ->
        from(project(path).sourceSets.main.output)
    }
    // The Fabric widener is not read on NeoForge.
    exclude 'sculptory.accesswidener'
    exclude devHarnessPackages
    manifest.attributes('Automatic-Module-Name': 'dev.sculptory')
}

// NeoForgeJarClassesTest: what a dedicated server loads names no client-only class, and the jar leaves the dev
// harnesses out. It scans the compiled classes and the built jar, so it runs after the jar is made.
tasks.named('test') {
    def jar = tasks.named('jar').flatMap { it.archiveFile }
    def serverClasses = project(':server').sourceSets.main.output.classesDirs
    dependsOn tasks.named('jar'), ':server:classes'
    inputs.file jar
    doFirst { systemProperty 'sculptory.jar', jar.get().asFile.absolutePath }
    systemProperty 'sculptory.mainClassDirs', (sourceSets.main.output.classesDirs + serverClasses).asPath
    systemProperty 'sculptory.mainResourceDir', sourceSets.main.output.resourcesDir.absolutePath
    systemProperty 'sculptory.devHarnessPackages', devHarnessPackages.join(',')
}

processResources {
    def version = project.version.toString()
    def minNeoForge = rootProject.neoforge_version.toString()
    def minecraft = rootProject.minecraft_version.toString()
    inputs.property 'version', version
    inputs.property 'minNeoForge', minNeoForge
    inputs.property 'minecraft', minecraft
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: version, minNeoForge: minNeoForge, minecraft: minecraft
    }
    dependsOn generateAccessTransformer
    // The mod icon is the Fabric jar's (modules/fabric), not copied.
    from(rootProject.file('modules/fabric/src/main/resources/assets/sculptory/icon.png')) {
        into 'assets/sculptory'
    }
    // The wiki goes into the mod for the in-game reader, as in modules/fabric.
    from(rootProject.file('docs/wiki')) {
        include '*.md', 'images/*.png'
        into 'assets/sculptory/wiki'
    }
}

// The jar is named after the build id (root build.gradle), so a new build leaves the older builds' jars behind: they
// are removed when the new jar is written, as in modules/fabric.
tasks.named('jar') {
    def libs = layout.buildDirectory.dir('libs')
    def keep = "sculptory-neoforge-${project.version}.jar".toString()
    doFirst {
        libs.get().asFile.listFiles()?.each { file ->
            if (file.name.startsWith('sculptory-') && file.name.endsWith('.jar') && file.name != keep) file.delete()
        }
    }
}

/**
 * Fabric access widener (v1/v2, named namespace) to NeoForge access transformer. accessible: public. extendable: public
 * and not final (a widened class can be subclassed, a widened method overridden). mutable (fields): not final; AT has
 * no "keep the access" level, but it never lowers access, so "private-f" only drops final. Entries for one member are
 * merged. Fields carry no descriptor in an AT; methods keep theirs (internal names, as the widener writes them).
 */
class AccessWidenerToAt {
    static String convert(File widener) {
        def lines = widener.readLines('UTF-8')
        if (lines.isEmpty() || !(lines[0] ==~ /accessWidener\s+v[12]\s+named\s*/)) {
            throw new IllegalArgumentException("${widener}: not a named-namespace access widener: ${lines ? lines[0] : ''}")
        }
        // target -> [public: bool, definal: bool], in widener order
        Map<String, Map<String, Boolean>> entries = new LinkedHashMap<>()
        lines.drop(1).eachWithIndex { String raw, int i ->
            String line = raw.replaceFirst(/#.*$/, '').trim()
            if (line.isEmpty()) return
            def parts = line.split(/\s+/)
            String access = parts[0].replaceFirst(/^transitive-/, '')
            String kind = parts[1]
            String owner = parts[2].replace('/', '.')
            String target
            switch (kind) {
                case 'class':
                    if (parts.length != 3) throw bad(widener, i, raw)
                    target = owner
                    break
                case 'method':
                    if (parts.length != 5) throw bad(widener, i, raw)
                    target = "${owner} ${parts[3]}${parts[4]}"
                    break
                case 'field':
                    if (parts.length != 5) throw bad(widener, i, raw)
                    target = "${owner} ${parts[3]}"
                    break
                default:
                    throw bad(widener, i, raw)
            }
            def entry = entries.computeIfAbsent(target) { [public: false, definal: false] }
            switch (access) {
                case 'accessible': entry.public = true; break
                case 'extendable': entry.public = true; entry.definal = true; break
                case 'mutable':
                    if (kind != 'field') throw bad(widener, i, raw)
                    entry.definal = true
                    break
                default: throw bad(widener, i, raw)
            }
        }
        def out = new StringBuilder('# Generated from sculptory.accesswidener (modules/common) at build time; edit that file.\n')
        entries.each { target, entry ->
            String modifier = (entry.public ? 'public' : 'private') + (entry.definal ? '-f' : '')
            out.append(modifier).append(' ').append(target).append('\n')
        }
        out.toString()
    }

    private static IllegalArgumentException bad(File widener, int index, String line) {
        new IllegalArgumentException("${widener}:${index + 2}: unsupported access widener entry: ${line}")
    }
}

// ================================================================================================================
// GameTests on NeoForge: the shared tests (modules/common, src/gametest and src/fidelity) in two test mods, each with
// its own headless GameTest server run, like modules/fabric's runGameTest and runFidelityGameTest. Nothing here reaches
// the mod jar.
//   gametest: the GameTests, mod sculptory_gametest (src/gametest: its @Mod class and neoforge.mods.toml).
//   fidelity: the mod-fidelity GameTests against the NeoForge builds of Chipped and Farmer's Delight, mod
//             sculptory_fidelity (src/fidelity). It compiles the shared GameTest sources again instead of loading the
//             gametest mod's classes, so the GameTest mod and its 464 tests stay out of that run.
// Both compile src/gametestSupport: the NeoForge GameTestLoader, the test permission handler and the registration of
// the shared test classes (NeoForgeGameTests says why they are not registered through NeoForge's annotations).
// ================================================================================================================
repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    gametest {
        java.srcDir project(':common').sourceSets.gametest.java
        java.srcDir 'src/gametestSupport/java'
        resources.srcDir project(':common').sourceSets.gametest.resources
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    fidelity {
        java.srcDir project(':common').sourceSets.gametest.java
        java.srcDir project(':common').file('src/fidelity/java')
        java.srcDir 'src/gametestSupport/java'
        resources.srcDir project(':common').file('src/fidelity/resources')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
neoForge.addModdingDependenciesTo(sourceSets.gametest)
neoForge.addModdingDependenciesTo(sourceSets.fidelity)
// The fidelity tests are placed on the shared empty structure too.
tasks.named('processFidelityResources') {
    from(project(':common').sourceSets.gametest.resources.srcDirs) { include 'data/**' }
}

dependencies {
    // The engine as for the main source set: compiled against, loaded as part of the sculptory mod.
    ['gametestCompileOnly', 'fidelityCompileOnly'].each { configuration ->
        add(configuration, project(':core'))
        add(configuration, project(':protocol'))
        add(configuration, project(':server'))
    }
    // NeoForge mods are built on Mojang's names like this one, so they are used as they are, with no remapping.
    fidelityImplementation "maven.modrinth:farmers-delight:${rootProject.fidelity_neoforge_farmersdelight}"
    fidelityRuntimeOnly "maven.modrinth:chipped:${rootProject.fidelity_neoforge_chipped}"
    fidelityRuntimeOnly "maven.modrinth:athena-ctm:${rootProject.fidelity_neoforge_athena}"
    fidelityRuntimeOnly "maven.modrinth:resourceful-lib:${rootProject.fidelity_neoforge_resourcefullib}"
}

neoForge {
    mods {
        sculptory_gametest { sourceSet sourceSets.gametest }
        sculptory_fidelity { sourceSet sourceSets.fidelity }
    }
    runs {
        gameTest {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            loadedMods = [mods.sculptory, mods.sculptory_gametest]
            gameDirectory = file('build/run/gameTest')
        }
        fidelityGameTest {
            type = 'gameTestServer'
            sourceSet = sourceSets.fidelity
            loadedMods = [mods.sculptory, mods.sculptory_fidelity]
            gameDirectory = file('build/run/fidelityGameTest')
        }
    }
}

def gameTestRuns = ['gameTest', 'fidelityGameTest']
neoForge.runs.matching { it.name in gameTestRuns }.configureEach { run ->
    // Only the shared tests' template namespace (NeoForge's filter; other mods' own GameTests stay out).
    run.systemProperty 'neoforge.enabledGameTestNamespaces', 'sculptory-gametest'
    // A JUnit-style report of the run, as Fabric API writes one.
    run.systemProperty 'sculptory.gametest.report', file("build/run/${run.name}/junit.xml").absolutePath
    // The heap a GitHub Actions runner gives the GameTest server by default, on every machine (modules/fabric).
    run.jvmArgument '-Xmx4G'
    run.disableIdeRun()
    // -PgameTestFilter=<text>[,<text>...]: only the GameTests whose name or batch contains an entry (GameTestFilter).
    if (project.hasProperty('gameTestFilter')) {
        run.systemProperty 'sculptory.gametest.filter', project.property('gameTestFilter').toString()
    }
}

// Each run starts from a fresh world (gradle/fresh-gametest-world.gradle), with the EULA accepted and the test
// permission handler selected (TestPermissionHandler): NeoForge reads config/neoforge-server.toml when the server
// starts.
apply from: rootProject.file('gradle/fresh-gametest-world.gradle')
gameTestRuns.each { runName ->
    def taskSuffix = runName.capitalize()
    def runDir = file("build/run/${runName}")
    def prepare = tasks.register("prepare${taskSuffix}Dir") {
        description = "Starts ${runName} from a fresh world, with the EULA accepted and the test permission handler."
        outputs.upToDateWhen { false }
        doLast {
            freshGameTestWorld(runDir)
            new File(runDir, 'eula.txt').with { parentFile.mkdirs(); text = 'eula=true\n' }
            new File(runDir, 'config/neoforge-server.toml').with {
                parentFile.mkdirs()
                text = '# Written by modules/neoforge/build.gradle for the GameTest runs.\n' +
                        'permissionHandler = "sculptory-gametest:permissions"\n'
            }
        }
    }
    tasks.named("run${taskSuffix}") { dependsOn prepare }
}
tasks.named('runFidelityGameTest') { mustRunAfter tasks.named('runGameTest') }
// One GameTest server at a time when a build runs both loaders' (check with org.gradle.parallel): each takes 4 GB.
tasks.named('runGameTest') { mustRunAfter ':fabric:runGameTest', ':fabric:runFidelityGameTest' }
tasks.named('check') {
    dependsOn tasks.named('runGameTest'), tasks.named('runFidelityGameTest')
}
