# A Bukkit plugin.yml, not a paper-plugin.yml (decided 2026-10-21): a plugin.yml plugin's class loader sees other
# plugins' classes, so the soft dependency on WorldGuard (and WorldEdit's API under it) needs no extra declaration,
# and paper-plugin.yml's class-loader isolation and bootstrapper buy nothing yet.
name: Sculptory
version: '${version}'
main: dev.sculptory.paper.SculptoryPlugin
api-version: '1.21'
description: In-game world editor engine for the Sculptory client mod (Minecraft ${minecraft}).
website: https://github.com/thearticulateidiot/sculptory
# WorldGuard (a soft dependency) loads first, so its regions are known when the engine starts.
softdepend: [WorldGuard, WorldEdit]
load: POSTWORLD
permissions:
  # The dev-only self-test, network test and region benchmark (they exist only with -Dsculptory.selftest.enabled=true).
  # Never granted by default, operators included.
  sculptory.selftest:
    default: false
