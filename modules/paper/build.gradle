// Sculptory for Paper (spike, Minecraft 1.21.1): a Bukkit plugin compiled against Paper's server in Mojang's names
// (paperweight-userdev's dev bundle). Paper runs Mojang-named since 1.20.5, so the jar is used as javac wrote it:
// nothing is reobfuscated, and the manifest says so (paperweight-mappings-namespace: mojang).
apply plugin: 'io.papermc.paperweight.userdev'

base { archivesName = 'sculptory-paper' }

repositories {
    maven { name = 'PaperMC'; url = 'https://repo.papermc.io/repository/maven-public/' }
    // WorldGuard's and WorldEdit's APIs, compile only (the server has the plugins).
    exclusiveContent {
        forRepository { maven { name = 'EngineHub'; url = 'https://maven.enginehub.org/repo/' } }
        filter {
            includeGroupByRegex 'com\\.sk89q.*'
            includeGroupByRegex 'org\\.enginehub.*'
        }
    }
    // The Mixin annotations for the probe source set only.
    exclusiveContent {
        forRepository { maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' } }
        filter { includeGroup 'net.fabricmc' }
    }
}

// The plugin takes the loader-free Minecraft code of modules/common as source, like the loader modules do, but through
// a copy (commonForPaper) with the few Paper-only changes no seam covers: the physics-off write and the light marker go
// through PaperAccess, captured entities lose CraftBukkit's world and spawn keys (CraftBukkitKeys), and the methods Paper's
// patched level interfaces declare abstract are added. (The access-widened reads go through the McInternals seam,
// which PaperAccess implements.) Every patch must match, so a change in modules/common that moves one fails here
// instead of silently compiling the old behaviour.
def commonSources = project(':common').file('src/main/java')
// Not on Paper: the mixins (Paper has none), builder mode's mixin-backed steps (BuilderCapture, CapturedBuilderSteps;
// Paper's are PaperBuilderSteps), the loaders' reads of widened members (WidenedMcInternals), the Fabric/NeoForge
// engine wiring and the command tree over it (the plugin wires the engine itself: PaperEngine, PaperEditHost,
// PaperCommands), and the light batch (Paper's own light engine; src/commonReplacements has its stand-in).
def commonExcludes = [
        'dev/sculptory/mc/mixin/**',
        'dev/sculptory/mc/builder/BuilderCapture.java',
        'dev/sculptory/mc/builder/CapturedBuilderSteps.java',
        'dev/sculptory/mc/command/**',
        'dev/sculptory/mc/engine/impl/EngineRuntime.java',
        'dev/sculptory/mc/engine/impl/EditServiceHost.java',
        'dev/sculptory/mc/world/WidenedMcInternals.java',
        'dev/sculptory/mc/world/LightBatch.java',
        'dev/sculptory/mc/playtest/**', // the dev-only playtest setup (PlaytestSetup), never in a jar
]
// What Paper's level interfaces add as abstract methods (LevelReader, BlockGetter, LevelAccessor), for the common
// classes that implement them over a ServerLevel field named world.
def levelReaderMethods = """
    // ---- Paper's additions to the level interfaces (added by the modules/paper build, task commonForPaper) ----
    @Override
    public net.minecraft.world.level.chunk.ChunkAccess getChunkIfLoadedImmediately(int x, int z) {
        return world.getChunkIfLoadedImmediately(x, z);
    }

    @Override
    public net.minecraft.world.level.block.state.BlockState getBlockStateIfLoaded(net.minecraft.core.BlockPos pos) {
        return getBlockState(pos);
    }

    @Override
    public net.minecraft.world.level.material.FluidState getFluidIfLoaded(net.minecraft.core.BlockPos pos) {
        return getFluidState(pos);
    }
"""
def levelAccessorMethods = levelReaderMethods + """
    @Override
    public net.minecraft.server.level.ServerLevel getMinecraftWorld() {
        return world;
    }
"""
def access = 'dev.sculptory.paper.nms.PaperAccess'
def commonPatches = [
        'dev/sculptory/mc/world/ClientSync.java': [
                // Paper's (Moonrise's) light engine throws UnsupportedOperationException here.
                ['light.waitForPendingTasks(cx + dx, cz + dz)', "${access}.lightMarker(light, cx + dx, cz + dz)"],
        ],
        'dev/sculptory/mc/world/BlockWriter.java': [
                ['world.setBlock(pos, state, Block.UPDATE_KNOWN_SHAPE, 0);',
                 "${access}.setBlockWithoutCallbacks(world, pos, state);"],
        ],
        'dev/sculptory/mc/world/McNeighbourShapes.java': [
                ['static final class View implements LevelAccessor {',
                 'static final class View implements LevelAccessor {\n' + levelAccessorMethods],
        ],
        'dev/sculptory/mc/engine/impl/LoadedOnlyView.java': [
                ['final class LoadedOnlyView implements LevelReader {',
                 'final class LoadedOnlyView implements LevelReader {\n' + levelReaderMethods],
        ],
        // CraftBukkit's world-bound and volatile entity keys (CraftBukkitKeys.STRIPPED) are not part of a captured entity.
        'dev/sculptory/mc/world/McEntities.java': [
                ['if (!entity.saveAsPassenger(nbt)) return null;',
                 'if (!entity.saveAsPassenger(nbt)) return null;\n        dev.sculptory.paper.nms.CraftBukkitKeys.strip(nbt);'],
        ],
        'dev/sculptory/mc/world/CapturingWorldAccess.java': [
                ['public final class CapturingWorldAccess implements WorldGenLevel {',
                 'public final class CapturingWorldAccess implements WorldGenLevel {\n' + levelAccessorMethods],
        ],
].collectEntries { k, v -> [k, v.collect { [it[0].toString(), it[1].toString()] }] }

// What the patches leave must stay as it is: a new use of these in the sources the plugin compiles would run on Paper
// without the mixin, the light-engine call or the patch it relies on. Each guard is [pattern, the files allowed to use
// it with how many uses each ("path=count,..."; empty: none), why]. The patterns are matched on each file's code with
// comments left out and whitespace normalised, so a call split over several lines is seen too.
def commonDriftGuards = [
        [/waitForPendingTasks\(/, '',
         "Paper's (Moonrise's) light engine throws there: route it through PaperAccess.lightMarker (a patch)."],
        [/setBlock\([^;]*UPDATE_KNOWN_SHAPE/, '',
         'A physics-off write needs PaperAccess.setBlockWithoutCallbacks on Paper (no mixin cancels onPlace/onRemove).'],
        [/saveAsPassenger\(|saveWithoutId\(|\.save\(new CompoundTag/, 'dev/sculptory/mc/world/McEntities.java=1',
         "Entity NBT is captured in McEntities.save alone, where CraftBukkit's world and spawn keys are stripped (a patch); another capture would keep them."],
        // BlockWriter.apply: the physics-off write (patched to PaperAccess.setBlockWithoutCallbacks, which skips
        // onPlace and onRemove itself) and Clearable.tryClear on the physics-on path. The second runs unsuppressed on
        // Paper, which is harmless for vanilla's block entities (checked against Paper 1.21.1's sources): every
        // clearContent only empties the block entity's items except the jukebox's, which changes its own HAS_RECORD
        // property, and a same-block change runs no onRemove or onPlace behaviour (nothing drops). The cell is then
        // written with physics on anyway, and its emptied contents cannot spill.
        [/EditScope\.suppressPhysics\(\)/, 'dev/sculptory/mc/world/BlockWriter.java=2',
         "EditScope suppresses nothing on Paper (its mixin is absent): BlockWriter's two uses are covered, a new one is not."],
].collect { it.collect { s -> s.toString() } }

// Every mixin of modules/common, with what does its work on Paper, which has no mixins: a mixin added to common would
// otherwise be silently absent from the plugin. The build fails when the mixin folder holds other files than these.
def commonMixinsOnPaper = [
        'AbstractBlockStateMixin.java'            : 'PaperAccess.setBlockWithoutCallbacks (the BlockWriter patch)',
        'BlockItemInvoker.java'                   : 'PaperAccess (McInternals)',
        'BuilderCaptureMixin.java'                : 'PaperBuilderSteps',
        'EntityChunkDataAccessMixin.java'         : 'HistorySaveHooks',
        'FluidTrailBlockChangeMixin.java'         : 'PaperFluidTrails',
        'FluidTrailChunkDataMixin.java'           : 'PaperFluidTrails',
        'FluidTrailTickMixin.java'                : 'PaperFluidTrails',
        'LightBatchMixin.java'                    : 'the LightBatch stand-in (src/commonReplacements)',
        'PlayerManagerMixin.java'                 : 'PermissionWatch',
        'ServerChunkLoadingManagerMixin.java'     : 'HistorySaveHooks',
        'ServerPlayerInteractionManagerMixin.java': 'BuilderModeListener',
        'VerticallyAttachableBlockItemAccessor.java': 'PaperAccess (McInternals)',
]
// Known detail, not patched: ClientSync and ServerNet resend whole chunks with the four-argument
// ClientboundLevelChunkWithLightPacket constructor, which Paper marks @Deprecated @DoNotUse in favour of the one with
// Anti-Xray's "modifyBlocks" flag. Paper's four-argument form passes modifyBlocks = true, so with Anti-Xray on a resent
// chunk is obfuscated like any other; only the deprecation warning remains.

def commonForPaper = tasks.register('commonForPaper', CommonOverlay) {
    description = 'Copies modules/common/src/main for the Paper plugin, with the Paper patches applied.'
    source = commonSources
    excludes = commonExcludes
    patches = commonPatches
    limits = commonDriftGuards
    pinnedFolder = 'dev/sculptory/mc/mixin'
    pinnedFiles = commonMixinsOnPaper
    outputDir = layout.buildDirectory.dir('generated/commonForPaper')
}

sourceSets {
    main {
        java.srcDir commonForPaper
        java.srcDir 'src/commonReplacements/java'
    }
}

dependencies {
    paperweight.paperDevBundle(rootProject.paper_dev_bundle_version)
    // The engine (no Minecraft code), packed into the plugin jar as classes (see the jar task).
    implementation project(':core')
    implementation project(':protocol')
    implementation project(':server')
    // LuckPerms' API, compile only (a soft dependency; the server has the plugin when it is used).
    compileOnly "net.luckperms:api:${rootProject.paper_luckperms_api_version}"
    compileOnly("com.sk89q.worldguard:worldguard-bukkit:${rootProject.paper_worldguard_api_version}") {
        // The server provides Bukkit/Paper; WorldGuard's own Spigot API dependency would shadow paper-api.
        exclude group: 'org.spigotmc'
        exclude group: 'io.papermc.paper'
    }
}

// paperweight 2.x: the plugin is used Mojang-named (Paper 1.20.5+), no reobfJar.
paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.Companion.MOJANG_PRODUCTION

// The dev-only self-test (Paper has no GameTests): the check groups, the network test and the region benchmark
// (dev.sculptory.paper.devtest), and the two helpers they need inside the plugin's packages (SelfTestSteps,
// WorldGuardTestRegions). Compiled against the plugin, never part of the release jar: only devJar packs them, with a
// META-INF/services entry the plugin looks up (DevExtras), so no release class names them.
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
}

// The jars are named after the build id, so older builds' jars are removed when a new one is written; the release jar
// and the dev jar of this build are both kept.
def libsDir = layout.buildDirectory.dir('libs')
def currentJars = ["sculptory-paper-${project.version}.jar".toString(), "sculptory-paper-${project.version}-dev.jar".toString()]
def removeOlderJars = { Task task ->
    task.doFirst {
        libsDir.get().asFile.listFiles()?.each { file ->
            if (file.name.startsWith('sculptory-') && file.name.endsWith('.jar') && !currentJars.contains(file.name)) {
                file.delete()
            }
        }
    }
}

tasks.named('jar') {
    // The engine's classes go into the plugin jar itself. They are our own code, not published to Maven Central, so
    // Paper's library loader (which resolves Maven coordinates when the server starts) can't supply them; their
    // packages are all dev.sculptory.*, so nothing needs relocating. fastutil, Gson and SLF4J come with the server.
    [':core', ':protocol', ':server'].each { path -> from(project(path).sourceSets.main.output) }
    manifest.attributes('paperweight-mappings-namespace': 'mojang')
    removeOlderJars(it)
}

// The release jar plus the self-test: sculptory-paper-<version>-dev.jar. For CI's paper-selftest job and test servers;
// installable like the release jar, never published. It is made from the release jar's contents, so whatever that jar
// carries (the engine, the licence texts) the dev jar carries too.
def releaseJarFile = tasks.named('jar').flatMap { it.archiveFile }
def devJar = tasks.register('devJar', Jar) {
    description = 'Builds the Paper plugin jar with the dev-only self-test (sculptory-paper-<version>-dev.jar).'
    group = 'build'
    archiveBaseName = base.archivesName
    archiveClassifier = 'dev'
    dependsOn tasks.named('jar')
    from(releaseJarFile.map { zipTree(it) }) { exclude 'META-INF/MANIFEST.MF' }
    from sourceSets.devtest.output
    manifest.attributes('paperweight-mappings-namespace': 'mojang')
    removeOlderJars(it)
}
tasks.named('assemble') { dependsOn devJar }

processResources {
    def version = project.version.toString()
    def minecraft = rootProject.minecraft_version.toString()
    inputs.property 'version', version
    inputs.property 'minecraft', minecraft
    filesMatching(['plugin.yml', 'sculptory-paper.properties']) { expand version: version, minecraft: minecraft }
}

// The probe: all of modules/common/src/main (the mixin classes too, compiled but never applied: Paper has no mixins)
// through the same patches, to show what compiles against Paper. Never part of the jar; `check` compiles it.
def commonProbe = tasks.register('commonProbe', CommonOverlay) {
    description = 'Copies all of modules/common/src/main with the Paper patches, for the compile probe.'
    source = commonSources
    // LightBatch is Paper's stand-in, so the mixin feeding the common one goes too; WidenedMcInternals reads members
    // only the access widener opens (Paper's McInternals is PaperAccess).
    excludes = ['dev/sculptory/mc/world/LightBatch.java', 'dev/sculptory/mc/mixin/LightBatchMixin.java',
                'dev/sculptory/mc/world/WidenedMcInternals.java',
                // The dev-only playtest setup never runs on Paper (it sets the difficulty server-wide, which Paper
                // keeps per world).
                'dev/sculptory/mc/playtest/**']
    patches = commonPatches
    outputDir = layout.buildDirectory.dir('generated/commonProbe')
}
sourceSets {
    probe {
        java.srcDir commonProbe
        java.srcDir 'src/commonReplacements/java'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
}
dependencies {
    probeCompileOnly "net.fabricmc:sponge-mixin:${rootProject.sponge_mixin_version}"
    probeCompileOnly "io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"
}
tasks.named('check') { dependsOn tasks.named('probeClasses') }

// PaperJarClassesTest: the release jar has none of the self-test and the dev jar has all of it. It opens both jars, so
// it runs after they are made.
tasks.named('test') {
    def releaseJar = tasks.named('jar').flatMap { it.archiveFile }
    def devJarFile = devJar.flatMap { it.archiveFile }
    dependsOn tasks.named('jar'), devJar
    inputs.file releaseJar
    inputs.file devJarFile
    doFirst {
        systemProperty 'sculptory.jar', releaseJar.get().asFile.absolutePath
        systemProperty 'sculptory.devJar', devJarFile.get().asFile.absolutePath
    }
    systemProperty 'sculptory.devClassDirs', sourceSets.devtest.output.classesDirs.asPath
    // MinecraftVersionGuardTest: the version processResources wrote into the plugin's resources.
    systemProperty 'sculptory.minecraftVersion', rootProject.minecraft_version.toString()
}

/** Copies Java sources with literal patches; each patch must match at least once in its file. */
abstract class CommonOverlay extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getSource()

    @Input
    abstract ListProperty<String> getExcludes()

    @Input
    abstract MapProperty<String, List<List<String>>> getPatches()

    /**
     * Drift guards, checked on the patched copy: [regex, the files allowed to match it ("path=count,..." relative to
     * the source root; empty: none), why]. Each file's code is matched with its comments left out and its whitespace
     * normalised (runs of whitespace become one space, none around . ( ) , ;), so a call split over lines is seen. A new
     * use in modules/common of something only a patch makes Paper-safe fails the build here. A call reached through a
     * helper of another name is not seen: a guard is a tripwire for the call itself, not a proof.
     */
    @Input
    abstract ListProperty<List<String>> getLimits()

    /** A folder of the source (relative path) whose files must be exactly {@link #getPinnedFiles}'s keys; optional. */
    @Input
    @org.gradle.api.tasks.Optional
    abstract Property<String> getPinnedFolder()

    /** The pinned folder's files (paths relative to it) and, for each, what replaces it on Paper. */
    @Input
    @org.gradle.api.tasks.Optional
    abstract MapProperty<String, String> getPinnedFiles()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @javax.inject.Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void run() {
        File out = outputDir.get().asFile
        // Read before the closure: inside it, the copy spec's own source and excludes would be found first.
        File from = source.get().asFile
        List<String> skipped = excludes.get()
        if (pinnedFolder.isPresent()) checkPin(new File(from, pinnedFolder.get()))
        fs.sync { spec ->
            spec.from(from)
            spec.exclude(skipped)
            spec.into(out)
        }
        patches.get().each { String path, List<List<String>> edits ->
            File file = new File(out, path)
            if (!new File(from, path).isFile()) throw new GradleException("Paper patch target ${path} is gone from modules/common")
            if (!file.isFile()) return // excluded from this copy
            String text = file.getText('UTF-8')
            edits.each { List<String> edit ->
                if (!text.contains(edit[0])) {
                    throw new GradleException("Paper patch for ${path} no longer matches: ${edit[0]}")
                }
                text = text.replace(edit[0], edit[1])
            }
            file.setText(text, 'UTF-8')
        }
        List<List<String>> guards = limits.getOrElse([])
        if (guards.isEmpty()) return
        Map<String, String> code = [:]
        out.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
            if (f.name.endsWith('.java')) {
                code[out.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, (char) '/')] =
                        normalised(f.getText('UTF-8'))
            }
        }
        guards.each { List<String> guard ->
            def pattern = java.util.regex.Pattern.compile(guard[0])
            Map<String, Integer> allowed = guard[1].split(',').findAll { !it.isBlank() }.collectEntries {
                def (path, count) = it.split('=')
                [(path.trim()): count.trim() as int]
            }
            List<String> over = []
            code.each { String path, String text ->
                int uses = 0
                def matcher = pattern.matcher(text)
                while (matcher.find()) uses++
                int max = allowed.getOrDefault(path, 0)
                if (uses > max) over << "${path}: ${uses} (allowed ${max})"
            }
            if (!over.isEmpty()) {
                throw new GradleException("Paper drift guard: /${guard[0]}/ in modules/common where it is not covered: " +
                        "${over}. ${guard[2]} (Allowed: ${allowed.isEmpty() ? 'nowhere' : allowed}; modules/paper/build.gradle, " +
                        "commonDriftGuards.)")
            }
        }
    }

    private void checkPin(File folder) {
        Set<String> found = new TreeSet<>()
        if (folder.isDirectory()) {
            folder.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
                found << folder.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, (char) '/')
            }
        }
        Set<String> pinned = new TreeSet<>(pinnedFiles.get().keySet())
        if (found == pinned) return
        Set<String> added = found - pinned
        Set<String> gone = pinned - found
        throw new GradleException("modules/common's ${pinnedFolder.get()} changed (new: ${added ?: 'none'}; gone: " +
                "${gone ?: 'none'}). Paper has no mixins, so a mixin there does nothing in the Paper plugin: write its " +
                "Paper replacement first (as PaperBuilderSteps, PaperFluidTrails or PermissionWatch replace the others), " +
                "then pin the file with that replacement in commonMixinsOnPaper (modules/paper/build.gradle); for a " +
                "removed file, remove its pin.")
    }

    /**
     * A Java source's code without its comments, whitespace normalised: runs of whitespace become one space, and none
     * is left around . ( ) , ; so a call reads the same however it is split over lines. String and character literals
     * are kept as they are (a comment marker inside one is not a comment).
     */
    static String normalised(String source) {
        StringBuilder code = new StringBuilder(source.length())
        int i = 0
        int n = source.length()
        while (i < n) {
            if (source.startsWith('//', i)) {
                int end = source.indexOf('\n', i)
                i = end < 0 ? n : end
            } else if (source.startsWith('/*', i)) {
                int end = source.indexOf('*/', i + 2)
                i = end < 0 ? n : end + 2
                code.append(' ')
            } else if (source.startsWith('"', i) || source.startsWith("'", i)) {
                String close = source.startsWith('"""', i) ? '"""' : source.substring(i, i + 1)
                int start = i
                i += close.length()
                // A backslash (char 92) escapes the next character.
                while (i < n && !source.startsWith(close, i)) i += (source.charAt(i) as int) == 92 ? 2 : 1
                i = Math.min(n, i + close.length())
                code.append(source, start, i)
            } else {
                code.append(source.charAt(i))
                i++
            }
        }
        return code.toString().replaceAll(/\s+/, ' ').replaceAll(/ ?([.(),;]) ?/, '$1')
    }
}
