# The Paper plugin's self-test on a real Paper server (Paper has no GameTests), called by ci.yml on every push and by
# release.yml before a Paper release. Paper 1.21.1 with WorldEdit and WorldGuard, the plugin's dev jar built from this
# commit (:paper:devJar, sculptory-paper-<build id>-dev.jar: the release jar with the self-test added; the release jar
# has none), the self-test run at start as a fake player, then the server stops. Fails on any failed check
# or on fewer checks than expected. Every download is pinned: Paper by its build and SHA-256 (PaperMC's Fill v3 API),
# WorldEdit and WorldGuard by their Modrinth version ids and SHA-512; the pins and the expected count are in
# scripts/paper-selftest.sh, which the steps run. It runs once per Paper redstone implementation
# (misc.redstone-implementation): Eigencraft and Alternate Current set wires without physics events, which the builder
# steps follow through the wire power event.
# No secret is passed in. Actions are pinned to full commit SHAs; the comment names the release.
name: Paper self-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  paper-selftest:
    name: paper-selftest (${{ matrix.redstone }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        redstone: [VANILLA, EIGENCRAFT, ALTERNATE_CURRENT]
    env:
      REDSTONE: ${{ matrix.redstone }}
      # The pins (Paper's build and SHA-256, WorldEdit's and WorldGuard's Modrinth version ids and SHA-512) and the
      # least number of checks are scripts/paper-selftest.sh's, in one place for CI and local runs alike.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # On a tag run (release.yml), Gradle builds it as the tagged release: the same build id as the release jar.
      - name: Build the plugin's dev jar
        run: ./gradlew :paper:devJar --stacktrace

      # The steps below are scripts/paper-selftest.sh, which a local run uses too (scripts/check-throttled.sh).
      - name: Download Paper, WorldEdit and WorldGuard
        run: scripts/paper-selftest.sh "$REDSTONE" download

      - name: Set the redstone implementation
        run: scripts/paper-selftest.sh "$REDSTONE" redstone

      - name: Run the Paper self-test
        run: scripts/paper-selftest.sh "$REDSTONE" run verify

      - name: Check the redstone implementation in force
        run: scripts/paper-selftest.sh "$REDSTONE" implementation

      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-selftest-${{ matrix.redstone }}
          path: |
            paper-server/selftest-report.xml
            paper-server/logs/latest.log
          if-no-files-found: ignore
          retention-days: 14
