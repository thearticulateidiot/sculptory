# Release workflow, one product per run, for tags <product>/v<build id>: fabric/v0.5.0+1.21.1,
# neoforge/v0.5.0-beta+1.21.1, paper/v0.1.0-beta+1.21.1 (the build id is the product's version plus the Minecraft
# version, gradle.properties). A -dev product or engine version is refused, and so is a suffix other than -alpha
# (store type alpha), -beta or -rc (store type beta); a version without a suffix is a release.
#   1. build:      the full check, then the product's release jar (sculptory-<product>-<build id>.jar, no commit
#                  suffix);
#   paper-selftest: the Paper plugin only: its self-test on a real Paper 1.21.1 server with the dev jar of the same
#                  build (paper-selftest.yml, as CI runs it); every job below waits for it;
#   2. github:     a GitHub Release titled "Sculptory for <Product> <build id>" (a pre-release for versions with a "-";
#                  "Latest" only for the Fabric mod) with the jar and the CHANGELOG.md entry headed
#                  "## <Product> <build id>";
#   3. modrinth,   uploads to Modrinth and CurseForge, each only when its token secret and the product's project id
#      curseforge: variable are set. The Fabric and NeoForge mods share one mod project on each store
#                  (MODRINTH_PROJECT_ID, CURSEFORGE_PROJECT_ID; the loader tells their versions apart); the Paper
#                  plugin has its own (MODRINTH_PAPER_PROJECT_ID, CURSEFORGE_BUKKIT_PROJECT_ID, a CurseForge "Bukkit
#                  Plugins" project);
#   4. hangar:     the Paper plugin only, to Hangar (PaperMC's plugin site) through its REST API, when the HANGAR_TOKEN
#                  secret and the HANGAR_PROJECT variable are set.
# Secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN, HANGAR_TOKEN. Variables: MODRINTH_PROJECT_ID, CURSEFORGE_PROJECT_ID,
# MODRINTH_PAPER_PROJECT_ID, CURSEFORGE_BUKKIT_PROJECT_ID, HANGAR_PROJECT. A store whose pair is missing is skipped
# with a notice, and the run still passes.
# The build job sees no secret and no write token. Actions are pinned to full commit SHAs; the comment names the release.
# Adding a product: a tag pattern below, a case in "The product from the tag", and its store variables.
name: Release

on:
  push:
    tags: ["fabric/v*", "neoforge/v*", "paper/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      product: ${{ steps.product.outputs.product }}
      product_name: ${{ steps.product.outputs.product_name }}
      version: ${{ steps.product.outputs.version }}
      jar: ${{ steps.product.outputs.jar }}
      version_type: ${{ steps.product.outputs.version_type }}
      loaders: ${{ steps.product.outputs.loaders }}
      game_versions: ${{ steps.product.outputs.game_versions }}
      dependencies: ${{ steps.product.outputs.dependencies }}
      latest: ${{ steps.product.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: The product from the tag
        id: product
        run: |
          product="${GITHUB_REF_NAME%%/*}"
          version="${GITHUB_REF_NAME#*/v}"
          minecraft="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          case "$product" in
            fabric)
              declared="$(sed -n 's/^sculptory_fabric_version=//p' gradle.properties)+$minecraft"
              echo "product_name=Fabric" >> "$GITHUB_OUTPUT"
              echo "jar=sculptory-fabric-$version.jar" >> "$GITHUB_OUTPUT"
              # Loom's remapped jar: Minecraft 1.21.1 is obfuscated, and the mod ships in intermediary names.
              echo "jar_task=:fabric:remapJar" >> "$GITHUB_OUTPUT"
              echo "loaders=fabric" >> "$GITHUB_OUTPUT"
              echo "game_versions=$minecraft" >> "$GITHUB_OUTPUT"
              echo "dependencies=fabric-api(required)" >> "$GITHUB_OUTPUT"
              echo "latest=true" >> "$GITHUB_OUTPUT"
              ;;
            neoforge)
              declared="$(sed -n 's/^sculptory_neoforge_version=//p' gradle.properties)+$minecraft"
              echo "product_name=NeoForge" >> "$GITHUB_OUTPUT"
              echo "jar=sculptory-neoforge-$version.jar" >> "$GITHUB_OUTPUT"
              # NeoForge runs on Mojang's names, so the plain jar is the release jar. Not ":neoforge:build": the check
              # above has run its tests already, and build would start the GameTest servers a second time.
              echo "jar_task=:neoforge:jar" >> "$GITHUB_OUTPUT"
              echo "loaders=neoforge" >> "$GITHUB_OUTPUT"
              echo "game_versions=$minecraft" >> "$GITHUB_OUTPUT"
              # Nothing beyond NeoForge itself. Left empty, mc-publish reads neoforge.mods.toml, whose only
              # dependencies (neoforge and minecraft) it leaves out.
              echo "dependencies=" >> "$GITHUB_OUTPUT"
              echo "latest=false" >> "$GITHUB_OUTPUT"
              ;;
            paper)
              declared="$(sed -n 's/^sculptory_paper_version=//p' gradle.properties)+$minecraft"
              echo "product_name=Paper" >> "$GITHUB_OUTPUT"
              echo "jar=sculptory-paper-$version.jar" >> "$GITHUB_OUTPUT"
              # Paper (1.20.5+) runs plugins in Mojang's names, so the plain jar is the release jar (no reobfJar).
              echo "jar_task=:paper:jar" >> "$GITHUB_OUTPUT"
              # "paper" is a plugin loader on Modrinth. On CurseForge it matches no mod loader, which makes mc-publish
              # use the Bukkit game versions that a "Bukkit Plugins" project takes.
              echo "loaders=paper" >> "$GITHUB_OUTPUT"
              echo "game_versions=$minecraft" >> "$GITHUB_OUTPUT"
              # WorldGuard, WorldEdit and LuckPerms are optional (softdepend in plugin.yml), so none is listed.
              echo "dependencies=" >> "$GITHUB_OUTPUT"
              echo "latest=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::No release recipe for the product '$product' (tag $GITHUB_REF_NAME)"
              exit 1
              ;;
          esac
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match gradle.properties (expected $product/v$declared)"
            exit 1
          fi
          # A -dev version (never released) has "-dev" as a dash-separated part: followed by the end, "+" or "."
          # (0.5.0-dev, 0.5.0-dev.2), not 0.5.0-devel; the same test as the Gradle build's (root build.gradle).
          # The store version type: -alpha is alpha, -beta and -rc are beta (the stores have no "rc"), and a version
          # without a suffix is a release; any other suffix is refused.
          dev_version='-dev($|[+.])'
          engine="$(sed -n 's/^sculptory_engine_version=//p' gradle.properties)"
          if [[ "$engine" =~ $dev_version ]]; then
            echo "::error::sculptory_engine_version=$engine: a release never has a -dev engine (CONTRIBUTING.md \"Versions and releases\")"
            exit 1
          fi
          if [[ "$version" =~ $dev_version ]]; then
            echo "::error::$version is a -dev version, which is never released"
            exit 1
          fi
          case "$version" in
            *-alpha*) type=alpha ;;
            *-beta* | *-rc*) type=beta ;;
            *-*)
              echo "::error::$version has a suffix the release knows no type for (use -alpha, -beta or -rc)"
              exit 1
              ;;
            *) type=release ;;
          esac
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_type=$type" >> "$GITHUB_OUTPUT"

      # Gradle makes a release build of the tagged product from the tag itself (root build.gradle).
      - name: Check
        run: ./gradlew check --stacktrace

      - name: Release jar
        run: ./gradlew ${{ steps.product.outputs.jar_task }} --stacktrace

      - name: Collect the jar and the release notes
        env:
          PRODUCT: ${{ steps.product.outputs.product }}
          PRODUCT_NAME: ${{ steps.product.outputs.product_name }}
          VERSION: ${{ steps.product.outputs.version }}
          JAR: ${{ steps.product.outputs.jar }}
        run: |
          mkdir dist
          jar="modules/$PRODUCT/build/libs/$JAR"
          if [ ! -f "$jar" ]; then
            echo "::error::$jar was not built"
            ls -l "modules/$PRODUCT/build/libs"
            exit 1
          fi
          cp "$jar" dist/
          # The CHANGELOG.md section headed "## <Product> <version>" (the heading may go on after a space), up to the
          # next "## " heading or a planned section ("### ... (planned)", still under Unreleased). A heading that still
          # says "(planned)" is refused: the section has not been promoted yet (CHANGELOG.md, "Unreleased").
          status=0
          awk -v v="## $PRODUCT_NAME $VERSION" '
            !found && index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") {
              if ($0 ~ /\(planned\)/) { planned = 1; exit }
              found = 1; next
            }
            found && (/^## / || /^### .*\(planned\)/) { exit }
            found
            END { if (planned) exit 3 }' CHANGELOG.md > dist/release-notes.md || status=$?
          if [ "$status" = 3 ]; then
            echo "::error::CHANGELOG.md's '## $PRODUCT_NAME $VERSION' section still says (planned)"
            exit 1
          elif [ "$status" != 0 ]; then
            echo "::error::Reading the release notes from CHANGELOG.md failed (awk exit $status)"
            exit 1
          fi
          if [ ! -s dist/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section headed '## $PRODUCT_NAME $VERSION'"
            exit 1
          fi
          (cd dist && sha256sum "$JAR" > "$JAR.sha256")
          ls -l dist

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            modules/*/build/reports/tests/
            modules/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The Paper plugin only: its self-test on a real Paper server (paper-selftest.yml, as in CI), with the dev jar of the
  # tagged build. Every publishing job below waits for it; a mod release skips it.
  paper-selftest:
    needs: build
    if: needs.build.outputs.product == 'paper'
    uses: ./.github/workflows/paper-selftest.yml

  github:
    needs: [build, paper-selftest]
    # Only when the build passed and the Paper self-test passed or was skipped (a mod release): without this, a job
    # that needs a skipped job is skipped too.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.paper-selftest.result == 'success' || needs.paper-selftest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          VERSION: ${{ needs.build.outputs.version }}
          JAR: ${{ needs.build.outputs.jar }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # Only the Fabric mod's releases may become "Latest"; the other products' never take that badge from it.
          latest="--latest=false"
          if [ "$LATEST" = "true" ] && [ -z "$prerelease" ]; then latest="--latest=true"; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease $latest \
            --title "Sculptory for $PRODUCT_NAME $VERSION" --notes-file dist/release-notes.md \
            "dist/$JAR" "dist/$JAR.sha256"

  # Optional: runs only when the MODRINTH_TOKEN secret and the product's project id variable exist: MODRINTH_PROJECT_ID
  # (the mod project; Fabric and NeoForge versions are told apart by their loader) or MODRINTH_PAPER_PROJECT_ID (the
  # plugin project).
  modrinth:
    needs: [build, paper-selftest]
    # Only when the build passed and the Paper self-test passed or was skipped (a mod release): without this, a job
    # that needs a skipped job is skipped too.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.paper-selftest.result == 'success' || needs.paper-selftest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      # The paper product takes the plugin project's variable, the mods the mod project's; '' when that one is unset.
      MODRINTH_PROJECT_ID: ${{ needs.build.outputs.product == 'paper' && vars.MODRINTH_PAPER_PROJECT_ID || needs.build.outputs.product != 'paper' && vars.MODRINTH_PROJECT_ID || '' }}
      PROJECT_VARIABLE: ${{ needs.build.outputs.product == 'paper' && 'MODRINTH_PAPER_PROJECT_ID' || 'MODRINTH_PROJECT_ID' }}
    steps:
      - name: Skip unless Modrinth is set up
        if: env.MODRINTH_TOKEN == '' || env.MODRINTH_PROJECT_ID == ''
        run: echo "::notice::Modrinth upload skipped (set the MODRINTH_TOKEN secret and the $PROJECT_VARIABLE variable)"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        with:
          name: release
          path: dist

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: dist/${{ needs.build.outputs.jar }}
          name: Sculptory for ${{ needs.build.outputs.product_name }} ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.version_type }}
          changelog-file: dist/release-notes.md
          loaders: ${{ needs.build.outputs.loaders }}
          game-versions: ${{ needs.build.outputs.game_versions }}
          java: 21
          dependencies: ${{ needs.build.outputs.dependencies }}
          # Never edit older versions: unfeaturing them needs the token's "edit versions" scope and is not wanted
          # anyway (Modrinth features the newest version per loader by itself when none is pinned).
          modrinth-unfeature-mode: none
          fail-mode: fail

  # Optional: runs only when the CURSEFORGE_TOKEN secret and the product's project id variable exist:
  # CURSEFORGE_PROJECT_ID (the mod project; Fabric and NeoForge files are told apart by their loader) or
  # CURSEFORGE_BUKKIT_PROJECT_ID (the plugin's "Bukkit Plugins" project). mc-publish 3.3.1 uploads to both kinds: for a
  # file whose loader matches no CurseForge mod loader it tries the Bukkit game versions first.
  curseforge:
    needs: [build, paper-selftest]
    # Only when the build passed and the Paper self-test passed or was skipped (a mod release): without this, a job
    # that needs a skipped job is skipped too.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.paper-selftest.result == 'success' || needs.paper-selftest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      # The paper product takes the plugin project's variable, the mods the mod project's; '' when that one is unset.
      CURSEFORGE_PROJECT_ID: ${{ needs.build.outputs.product == 'paper' && vars.CURSEFORGE_BUKKIT_PROJECT_ID || needs.build.outputs.product != 'paper' && vars.CURSEFORGE_PROJECT_ID || '' }}
      PROJECT_VARIABLE: ${{ needs.build.outputs.product == 'paper' && 'CURSEFORGE_BUKKIT_PROJECT_ID' || 'CURSEFORGE_PROJECT_ID' }}
    steps:
      - name: Skip unless CurseForge is set up
        if: env.CURSEFORGE_TOKEN == '' || env.CURSEFORGE_PROJECT_ID == ''
        run: echo "::notice::CurseForge upload skipped (set the CURSEFORGE_TOKEN secret and the $PROJECT_VARIABLE variable)"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        with:
          name: release
          path: dist

      - name: Publish to CurseForge
        if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: dist/${{ needs.build.outputs.jar }}
          name: Sculptory for ${{ needs.build.outputs.product_name }} ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.version_type }}
          changelog-file: dist/release-notes.md
          loaders: ${{ needs.build.outputs.loaders }}
          game-versions: ${{ needs.build.outputs.game_versions }}
          java: 21
          dependencies: ${{ needs.build.outputs.dependencies }}
          fail-mode: fail

  # Optional, the Paper plugin only: runs when the HANGAR_TOKEN secret (a Hangar API key with the create_version
  # permission) and the HANGAR_PROJECT variable (the project's slug, as in hangar.papermc.io/<owner>/<slug>) exist.
  # No action: Hangar's REST API with curl, as PaperMC's hangar-publish-plugin calls it. The API key buys a short-lived
  # token (POST /authenticate), and the upload is one multipart POST to /projects/<slug>/upload with a "versionUpload"
  # JSON part and the jar as "files". Releases go to Hangar's "Release" channel, alpha and beta versions to "Snapshot"
  # (the two channels a new Hangar project starts with).
  hangar:
    needs: [build, paper-selftest]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.product == 'paper' && needs.paper-selftest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
      HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
    steps:
      - name: Skip unless Hangar is set up
        if: env.HANGAR_TOKEN == '' || env.HANGAR_PROJECT == ''
        run: echo "::notice::Hangar upload skipped (set the HANGAR_TOKEN secret and the HANGAR_PROJECT variable)"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.HANGAR_TOKEN != '' && env.HANGAR_PROJECT != ''
        with:
          name: release
          path: dist

      - name: Publish to Hangar
        if: env.HANGAR_TOKEN != '' && env.HANGAR_PROJECT != ''
        env:
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_TYPE: ${{ needs.build.outputs.version_type }}
          GAME_VERSIONS: ${{ needs.build.outputs.game_versions }}
          JAR: ${{ needs.build.outputs.jar }}
        run: |
          set -euo pipefail
          api="https://hangar.papermc.io/api/v1"
          status=$(curl -sS -o auth.json -w '%{http_code}' -X POST -G --data-urlencode "apiKey=$HANGAR_TOKEN" \
            "$api/authenticate")
          if [ "$status" != "200" ]; then
            echo "::error::Hangar refused the API key (HTTP $status)"
            cat auth.json
            exit 1
          fi
          token="$(jq -r '.token' auth.json)"
          echo "::add-mask::$token"
          rm auth.json
          case "$VERSION_TYPE" in
            release) channel=Release ;;
            *) channel=Snapshot ;;
          esac
          jq -n --arg version "$VERSION" --arg channel "$channel" --arg minecraft "$GAME_VERSIONS" \
            --rawfile notes dist/release-notes.md \
            '{version: $version, channel: $channel, description: $notes,
              files: [{platforms: ["PAPER"]}],
              platformDependencies: {PAPER: [$minecraft]},
              pluginDependencies: {PAPER: []}}' > version-upload.json
          cat version-upload.json
          status=$(curl -sS -o upload.json -w '%{http_code}' -X POST -H "Authorization: $token" \
            -F "versionUpload=<version-upload.json;type=application/json" \
            -F "files=@dist/$JAR;type=application/octet-stream" \
            "$api/projects/$HANGAR_PROJECT/upload")
          cat upload.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Hangar upload failed (HTTP $status)"
            exit 1
          fi
