# Release workflow, one product per run, for tags <product>/v<build id>, e.g. fabric/v0.5.0+1.21.1 (the build id is the
# product's version plus the Minecraft version, gradle.properties):
#   1. build:      the full check, then the product's release jar (sculptory-fabric-<build id>.jar, no commit suffix);
#   2. github:     a GitHub Release (a pre-release for versions with a "-"; "Latest" only for the Fabric mod) with the
#                  jar and the CHANGELOG.md entry headed "## <Product> <build id>";
#   3. modrinth,   uploads to Modrinth and CurseForge, each only when its token secret (MODRINTH_TOKEN,
#      curseforge: CURSEFORGE_TOKEN) and the product's project id variable (MODRINTH_PROJECT_ID, CURSEFORGE_PROJECT_ID
#                  for the Fabric mod) are set.
# The build job sees no secret and no write token. Actions are pinned to full commit SHAs; the comment names the release.
# Adding a product: a tag pattern below, a case in "The product from the tag", and its store variables.
name: Release

on:
  push:
    tags: ["fabric/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      product: ${{ steps.product.outputs.product }}
      product_name: ${{ steps.product.outputs.product_name }}
      version: ${{ steps.product.outputs.version }}
      jar: ${{ steps.product.outputs.jar }}
      version_type: ${{ steps.product.outputs.version_type }}
      loaders: ${{ steps.product.outputs.loaders }}
      game_versions: ${{ steps.product.outputs.game_versions }}
      dependencies: ${{ steps.product.outputs.dependencies }}
      latest: ${{ steps.product.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: The product from the tag
        id: product
        run: |
          product="${GITHUB_REF_NAME%%/*}"
          version="${GITHUB_REF_NAME#*/v}"
          minecraft="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          case "$product" in
            fabric)
              declared="$(sed -n 's/^sculptory_fabric_version=//p' gradle.properties)+$minecraft"
              echo "product_name=Fabric" >> "$GITHUB_OUTPUT"
              echo "jar=sculptory-fabric-$version.jar" >> "$GITHUB_OUTPUT"
              echo "loaders=fabric" >> "$GITHUB_OUTPUT"
              echo "game_versions=$minecraft" >> "$GITHUB_OUTPUT"
              echo "dependencies=fabric-api(required)" >> "$GITHUB_OUTPUT"
              echo "latest=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::No release recipe for the product '$product' (tag $GITHUB_REF_NAME)"
              exit 1
              ;;
          esac
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match gradle.properties (expected $product/v$declared)"
            exit 1
          fi
          case "$version" in
            *-alpha*) type=alpha ;;
            *-beta*) type=beta ;;
            *) type=release ;;
          esac
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_type=$type" >> "$GITHUB_OUTPUT"

      # Gradle makes a release build of the tagged product from the tag itself (root build.gradle).
      - name: Check
        run: ./gradlew check --stacktrace

      - name: Release jar
        run: ./gradlew :${{ steps.product.outputs.product }}:remapJar --stacktrace

      - name: Collect the jar and the release notes
        env:
          PRODUCT: ${{ steps.product.outputs.product }}
          PRODUCT_NAME: ${{ steps.product.outputs.product_name }}
          VERSION: ${{ steps.product.outputs.version }}
          JAR: ${{ steps.product.outputs.jar }}
        run: |
          mkdir dist
          jar="modules/$PRODUCT/build/libs/$JAR"
          if [ ! -f "$jar" ]; then
            echo "::error::$jar was not built"
            ls -l "modules/$PRODUCT/build/libs"
            exit 1
          fi
          cp "$jar" dist/
          # The CHANGELOG.md section whose heading starts with "## <Product> <version>", up to the next "## " heading.
          awk -v v="## $PRODUCT_NAME $VERSION" 'index($0, v) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section headed '## $PRODUCT_NAME $VERSION'"
            exit 1
          fi
          (cd dist && sha256sum "$JAR" > "$JAR.sha256")
          ls -l dist

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            modules/*/build/reports/tests/
            modules/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  github:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_NAME: ${{ needs.build.outputs.product_name }}
          VERSION: ${{ needs.build.outputs.version }}
          JAR: ${{ needs.build.outputs.jar }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # Only the Fabric mod's releases may become "Latest"; the other products' never take that badge from it.
          latest="--latest=false"
          if [ "$LATEST" = "true" ] && [ -z "$prerelease" ]; then latest="--latest=true"; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease $latest \
            --title "Sculptory for $PRODUCT_NAME $VERSION" --notes-file dist/release-notes.md \
            "dist/$JAR" "dist/$JAR.sha256"

  # Optional: runs only when the MODRINTH_TOKEN secret and the product's MODRINTH_PROJECT_ID variable exist.
  modrinth:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
    steps:
      - name: Skip unless Modrinth is set up
        if: env.MODRINTH_TOKEN == '' || env.MODRINTH_PROJECT_ID == ''
        run: echo "::notice::Modrinth upload skipped (set the MODRINTH_TOKEN secret and the MODRINTH_PROJECT_ID variable)"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        with:
          name: release
          path: dist

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: dist/${{ needs.build.outputs.jar }}
          name: Sculptory for ${{ needs.build.outputs.product_name }} ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.version_type }}
          changelog-file: dist/release-notes.md
          loaders: ${{ needs.build.outputs.loaders }}
          game-versions: ${{ needs.build.outputs.game_versions }}
          java: 21
          dependencies: ${{ needs.build.outputs.dependencies }}
          fail-mode: fail

  # Optional: runs only when the CURSEFORGE_TOKEN secret and the product's CURSEFORGE_PROJECT_ID variable exist.
  curseforge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - name: Skip unless CurseForge is set up
        if: env.CURSEFORGE_TOKEN == '' || env.CURSEFORGE_PROJECT_ID == ''
        run: echo "::notice::CurseForge upload skipped (set the CURSEFORGE_TOKEN secret and the CURSEFORGE_PROJECT_ID variable)"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        with:
          name: release
          path: dist

      - name: Publish to CurseForge
        if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: dist/${{ needs.build.outputs.jar }}
          name: Sculptory for ${{ needs.build.outputs.product_name }} ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.version_type }}
          changelog-file: dist/release-notes.md
          loaders: ${{ needs.build.outputs.loaders }}
          game-versions: ${{ needs.build.outputs.game_versions }}
          java: 21
          dependencies: ${{ needs.build.outputs.dependencies }}
          fail-mode: fail
