# Runs the full check (JUnit and the headless Fabric GameTests) on every push to a branch and every pull request.
# Actions are pinned to full commit SHAs; the comment names the release.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # check = JUnit (core, protocol, server, fabric, neoforge) + runGameTest (vanilla) + runFidelityGameTest (Chipped,
      # Farmer's Delight). The GameTests run on a headless dedicated server, so no display is needed. :neoforge is
      # configured and compiled too (its JUnit tests scan the built jar): on a runner without a cached Gradle home that
      # first makes NeoForge's Minecraft (ModDevGradle downloads it and runs the NeoForm decompile, recompile and
      # patches), an estimated 3 to 5 extra minutes, not measured on CI; much less when the restored Gradle cache
      # already holds that work (~/.gradle/caches/neoformruntime).
      - name: Check
        run: ./gradlew check --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            modules/*/build/reports/tests/
            modules/*/build/test-results/
            modules/fabric/build/run/gameTest/logs/
            modules/fabric/build/run/fidelityGameTest/logs/
          if-no-files-found: ignore
          retention-days: 14
