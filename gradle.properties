org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
minecraft_version=1.21.1
# Parchment release for this Minecraft version (parameter names and javadoc over Mojang's official names).
parchment_version=2024.11.17
# The published minimum loader (fabric.mod.json), on purpose also the dev loader: a mod compiled against a newer
# loader's Mixin library (sponge-mixin 0.17 from loader 0.20) writes mixin annotations that loader 0.16.14's
# sponge-mixin 0.15.5 and MixinExtras 0.4.1 cannot read, and the jar fails to load there. Raising this means raising
# the minimum players and servers need.
loader_version=0.16.14
# The Mixin annotations the common module compiles against: the versions Fabric Loader 0.16.14 ships; never bundled.
sponge_mixin_version=0.15.5+mixin.0.8.7
mixinextras_version=0.4.1
fabric_version=0.116.4+1.21.1
fastutil_version=8.5.12
permissions_api_version=0.3.1
# What Minecraft 1.21.1 ships (its version manifest); the server module compiles against them and never bundles them.
gson_version=2.10.1
slf4j_version=2.0.9
# Test-only mods for the fidelity GameTests (runFidelityGameTest); never bundled.
# Modrinth version ids: immutable, and unambiguous where a version number exists for several loaders.
# Chipped 4.0.2 (Fabric 1.21.1)
fidelity_chipped=6h2mVZcb
# Athena 4.0.1 (Fabric 1.21), required by Chipped
fidelity_athena=7G1e11iK
# Resourceful Lib 3.0.11 (Fabric 1.21), required by Chipped
fidelity_resourcefullib=qhDtAMev
# Farmer's Delight Refabricated 1.21.1-3.2.2 (pinned when the build ran Loom 1.10.5, which could not remap 3.2.3+;
# Loom 1.17 and Loader 0.20 could take a newer build; not changed with the toolchain so the fidelity tests stay the same)
fidelity_farmersdelight=vj4n2BSl
mod_version=0.5.0-dev
maven_group=dev.sculptory
# Optional render mods for the dev client only (-PbsSodium, -PbsIris; see scripts/playtest.ps1). Never bundled.
# Pinned by Modrinth version id: Sodium mc1.21.1-0.6.13-fabric (u1OEbNKx) and Iris 1.8.8+1.21.1-fabric (zsoi0dso),
# the newest Iris release for 1.21.1, which needs Sodium 0.6.x.
sodium_version=u1OEbNKx
iris_version=zsoi0dso
# The dev-only shader pack the play check runs Iris with (scripts/playtest.ps1 -Check -Iris), downloaded into .local,
# never bundled: Complementary Shaders - Reimagined r5.9.3 by Modrinth version id, and its file's SHA-1.
check_shaderpack_version=Bqen1mJX
check_shaderpack_sha1=838139b54cddb56b2e83cd260d8efd960ac536d6
