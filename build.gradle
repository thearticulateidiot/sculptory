plugins {
    // The remapping Loom (Minecraft 1.21.1 is obfuscated). Needs Gradle 9.4+. 1.17 is the last Loom that runs the build
    // on a JDK 21; 1.18+ needs a JDK 25 to run Gradle (its natives use Java 25's FFM API).
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21' apply false
    // ModDevGradle for the NeoForge mod (modules/neoforge): NeoForge runs on Mojang's names, so nothing is remapped.
    id 'net.neoforged.moddev' version '2.0.148' apply false
    // paperweight-userdev for the Paper plugin (modules/paper): Paper's server in Mojang's names (a dev bundle), which
    // Paper 1.20.5+ also runs on, so nothing is reobfuscated.
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24' apply false
}

// Versions and build ids (gradle.properties). The engine modules (core, protocol, server, common) carry the engine
// version; each product module (fabric, neoforge, paper; forge later) carries its own version plus the
// Minecraft version it is built for. A dev build adds the commit it was made from: 0.5.0-dev+1.21.1.6a043a85, with
// ".dirty" when the checkout had uncommitted changes (new files git doesn't ignore included) and "nogit" where git or
// the repository is missing. A release build is the version and the Minecraft version alone, 0.5.0+1.21.1: every
// product at once with -Prelease, or one product in GitHub Actions from its tag <product>/v<build id>
// (fabric/v0.5.0+1.21.1; CONTRIBUTING.md "Versions and releases"). A product's build id names its jar
// (sculptory-fabric-<id>.jar), is the version in the mod list, and client and server show it at the handshake.
def git = { List<String> args ->
    try {
        def result = providers.exec {
            commandLine(['git', '--no-optional-locks', '-C', rootDir.absolutePath] + args)
            ignoreExitValue = true
        }
        return result.result.get().exitValue == 0 ? result.standardOutput.asText.get().trim() : null
    } catch (Exception noGit) {
        return null
    }
}
ext.products = [
        fabric: [version: sculptory_fabric_version, minecraft: minecraft_version],
        neoforge: [version: sculptory_neoforge_version, minecraft: minecraft_version],
        paper: [version: sculptory_paper_version, minecraft: minecraft_version],
]
def ciTag = providers.environmentVariable('GITHUB_REF_TYPE').getOrElse('') == 'tag'
        ? providers.environmentVariable('GITHUB_REF_NAME').getOrElse('') : ''
def tagMatch = ciTag =~ /^([a-z]+)\/v(.+)$/
def releaseProduct = tagMatch ? tagMatch[0][1] : null
def releaseTagId = tagMatch ? tagMatch[0][2] : null
if (ciTag.startsWith('v') || (releaseProduct != null && !products.containsKey(releaseProduct))) {
    throw new GradleException("A release tag names its product and build id, e.g. fabric/v${sculptory_fabric_version}+" +
            "${minecraft_version} (products: ${products.keySet()}), not ${ciTag}")
}
def releaseAll = providers.gradleProperty('release').map { it != 'false' }.getOrElse(false)
// A release never carries a -dev version, neither the product's nor the engine's. The engine id is the engine version
// alone in a release, so it is bumped for every product release that includes shared-code changes (CONTRIBUTING.md
// "Versions and releases"); a -dev engine would let two releases from different commits show the same engine id.
if (releaseAll || releaseProduct != null) {
    def released = releaseAll ? products.keySet().toList() : [releaseProduct]
    def versions = [engine: sculptory_engine_version.toString()] +
            released.collectEntries { [(it): products[it].version.toString()] }
    def devVersions = versions.findAll { name, version -> version =~ /-dev\b/ }
    if (devVersions) {
        throw new GradleException("A release build can't have a -dev version: " +
                devVersions.collect { name, version -> "sculptory_${name}_version=${version}" }.join(', ') +
                " in gradle.properties. Set the release version first" +
                (releaseAll ? " (-Prelease makes a release build of every product)." : " (tag ${ciTag})."))
    }
}
def commit = git(['rev-parse', '--short=8', 'HEAD'])
def changes = git(['status', '--porcelain'])
def commitMetadata = commit == null || commit.isEmpty() ? 'nogit' : commit + (changes ? '.dirty' : '')
if ((releaseAll || releaseProduct != null) && changes) {
    logger.warn("Release build from a checkout with ${changes.readLines().size()} uncommitted changes (git status); " +
            "the jar's version doesn't show them")
}
ext.engineBuildId = releaseAll || releaseProduct != null ? sculptory_engine_version.toString()
        : "${sculptory_engine_version}+${commitMetadata}".toString()
ext.buildIdFor = { String product ->
    def p = products[product]
    if (p == null) throw new GradleException("No product ${product} (gradle.properties, root build.gradle products)")
    boolean release = releaseAll || product == releaseProduct
    String id = release ? "${p.version}+${p.minecraft}" : "${p.version}+${p.minecraft}.${commitMetadata}"
    if (product == releaseProduct && id != releaseTagId) {
        throw new GradleException("The tag ${ciTag} doesn't match sculptory_${product}_version=${p.version} and " +
                "minecraft_version=${p.minecraft} in gradle.properties (expected ${product}/v${id})")
    }
    id
}

subprojects {
    apply plugin: 'java-library'
    group = rootProject.maven_group
    // A product's version is its build id; the engine modules carry the engine version.
    version = rootProject.products.containsKey(name) ? rootProject.buildIdFor(name) : rootProject.engineBuildId

    repositories {
        mavenCentral()
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach {
        // Fails any permit asked about a cell outside the bounds it was asked for (server engine PermitBounds).
        systemProperty 'sculptory.checkPermitBounds', 'true'
        useJUnitPlatform()
        testLogging {
            events = ['failed']
            exceptionFormat = 'full'
        }
    }
    // Every jar (the mod and its nested core, protocol and server jars) carries the licence texts NOTICE.md names.
    // The files are resolved here, not inside the task (reading the project from a running task is going away).
    def licence = rootProject.file('LICENSE')
    def notice = rootProject.file('NOTICE.md')
    def ccBySa = rootProject.file('LICENSES/CC-BY-SA-4.0.txt')
    tasks.named('jar') {
        from(licence)
        from(notice)
        from(ccBySa) { into 'LICENSES' }
    }
}
